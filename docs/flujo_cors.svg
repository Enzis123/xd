<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1090" viewBox="0 0 1340 1090" font-family="Arial, Helvetica, sans-serif">
<title>Flujo CORS: preflight OPTIONS y bloqueo sin CORS</title>
<defs>
<marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker>
<marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker>
</defs>
<style>
.t{font-size:22px;font-weight:bold;fill:#1a1a1a}
.p{font-size:16px;font-weight:bold}
.h{font-size:14px;font-weight:bold;fill:#1a1a1a}
.hs{font-size:12px;fill:#444}
.m{font-size:13px;fill:#111;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.mb{font-size:13px;font-weight:bold;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.mono{font-family:"DejaVu Sans Mono","Courier New",monospace;font-size:12px;fill:#222}
.n{font-size:12.5px;fill:#333}
.nb{font-size:13px;font-weight:bold;fill:#1a1a1a}
</style>
<rect width="1340" height="1090" fill="#fff"/>
<text x="670.0" y="34" text-anchor="middle" class="t">Flujo CORS: preflight OPTIONS, petición real y caso bloqueado</text>
<rect x="20" y="58" width="1300" height="590" rx="10" fill="#fbfdfb" stroke="#2e7d32" stroke-width="2"/>
<text x="40" y="86" class="p" fill="#2e7d32">Caso A — Con CORSMiddleware (como está configurado en backend/main.py)</text>
<line x1="150" y1="150" x2="150" y2="630" stroke="#999" stroke-dasharray="5 4"/>
<rect x="45" y="102" width="210" height="48" rx="6" fill="#fff8e1" stroke="#c77700" stroke-width="1.5"/>
<text x="150" y="123" text-anchor="middle" class="h">Código JS (api.js)</text>
<text x="150" y="140" text-anchor="middle" class="hs">origen http://localhost:5500</text>
<line x1="500" y1="150" x2="500" y2="630" stroke="#999" stroke-dasharray="5 4"/>
<rect x="395" y="102" width="210" height="48" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
<text x="500" y="123" text-anchor="middle" class="h">Navegador</text>
<text x="500" y="140" text-anchor="middle" class="hs">aplica Same-Origin Policy</text>
<line x1="900" y1="150" x2="900" y2="630" stroke="#999" stroke-dasharray="5 4"/>
<rect x="795" y="102" width="210" height="48" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="900" y="123" text-anchor="middle" class="h">Servidor FastAPI</text>
<text x="900" y="140" text-anchor="middle" class="hs">http://localhost:8000</text>
<line x1="150" y1="185" x2="498" y2="185" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
<text x="162" y="177" class="m" fill="#222">1. fetch(POST /libros, Content-Type: application/json)</text>
<rect x="370" y="200" width="260" height="86" rx="6" fill="#f7f3fd" stroke="#5e35b1" stroke-width="1.5"/>
<text x="382" y="222" class="nb">2. El navegador decide:</text>
<text x="382" y="240" class="n">¿mismo origen? 5500 ≠ 8000 → NO</text>
<text x="382" y="258" class="n">¿request «simple»? No (es JSON)</text>
<text x="382" y="276" class="n">→ primero manda un preflight</text>
<line x1="500" y1="310" x2="898" y2="310" stroke="#5e35b1" stroke-width="2" marker-end="url(#f)"/>
<text x="512" y="302" class="mb" fill="#5e35b1">3. OPTIONS /libros  (preflight)</text>
<rect x="510" y="320" width="390" height="63" rx="4" fill="#f7f7f7" stroke="#888"/>
<text x="520" y="340" class="mono">Origin: http://localhost:5500</text>
<text x="520" y="357" class="mono">Access-Control-Request-Method: POST</text>
<text x="520" y="374" class="mono">Access-Control-Request-Headers: content-type</text>
<line x1="900" y1="425" x2="502" y2="425" stroke="#2e7d32" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#fv)"/>
<text x="512" y="417" class="mb" fill="#2e7d32">4. 200 OK  (respuesta de CORSMiddleware)</text>
<rect x="510" y="435" width="390" height="97" rx="4" fill="#f1f8f1" stroke="#2e7d32"/>
<text x="520" y="455" class="mono">Access-Control-Allow-Origin: *</text>
<text x="520" y="472" class="mono">Access-Control-Allow-Methods: DELETE, GET, HEAD,</text>
<text x="520" y="489" class="mono">        OPTIONS, PATCH, POST, PUT</text>
<text x="520" y="506" class="mono">Access-Control-Allow-Headers: content-type</text>
<text x="520" y="523" class="mono">Access-Control-Max-Age: 600</text>
<line x1="500" y1="560" x2="898" y2="560" stroke="#1f5fa8" stroke-width="2" marker-end="url(#fb)"/>
<text x="512" y="552" class="mb" fill="#1f5fa8">5. POST /libros (petición real) + Origin + body JSON</text>
<line x1="900" y1="592" x2="502" y2="592" stroke="#2e7d32" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#fv)"/>
<text x="512" y="584" class="m" fill="#2e7d32">6. 201 Created + Access-Control-Allow-Origin: *</text>
<line x1="500" y1="622" x2="152" y2="622" stroke="#2e7d32" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#fv)"/>
<text x="162" y="614" class="m" fill="#2e7d32">7. ✓ la promesa de fetch se resuelve</text>
<rect x="985" y="170" width="320" height="104" rx="6" fill="#f7f3fd" stroke="#5e35b1" stroke-width="1.5"/>
<text x="997" y="192" class="nb">¿Qué es un «origen»?</text>
<text x="997" y="210" class="n">esquema + host + puerto</text>
<text x="997" y="228" class="n">http://localhost:5500  (frontend)</text>
<text x="997" y="246" class="n">http://localhost:8000  (backend)</text>
<text x="997" y="264" class="n">Cambia el puerto → otro origen.</text>
<rect x="985" y="300" width="320" height="140" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.5"/>
<text x="997" y="322" class="nb">Preflight</text>
<text x="997" y="340" class="n">Pregunta previa (método OPTIONS)</text>
<text x="997" y="358" class="n">que hace el navegador por su cuenta</text>
<text x="997" y="376" class="n">antes de un POST/PUT/DELETE con</text>
<text x="997" y="394" class="n">JSON hacia otro origen. Nuestro</text>
<text x="997" y="412" class="n">código JS no lo escribe.</text>
<text x="997" y="430" class="n">Max-Age: 600 → se cachea 10 min.</text>
<rect x="20" y="670" width="1300" height="400" rx="10" fill="#fffafa" stroke="#b3261e" stroke-width="2"/>
<text x="40" y="698" class="p" fill="#b3261e">Caso B — Sin CORSMiddleware (si borráramos app.add_middleware en main.py)</text>
<line x1="150" y1="762" x2="150" y2="970" stroke="#999" stroke-dasharray="5 4"/>
<rect x="45" y="714" width="210" height="48" rx="6" fill="#fff8e1" stroke="#c77700" stroke-width="1.5"/>
<text x="150" y="735" text-anchor="middle" class="h">Código JS (api.js)</text>
<text x="150" y="752" text-anchor="middle" class="hs">origen http://localhost:5500</text>
<line x1="500" y1="762" x2="500" y2="970" stroke="#999" stroke-dasharray="5 4"/>
<rect x="395" y="714" width="210" height="48" rx="6" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
<text x="500" y="735" text-anchor="middle" class="h">Navegador</text>
<text x="500" y="752" text-anchor="middle" class="hs">aplica Same-Origin Policy</text>
<line x1="900" y1="762" x2="900" y2="970" stroke="#999" stroke-dasharray="5 4"/>
<rect x="795" y="714" width="210" height="48" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="900" y="735" text-anchor="middle" class="h">Servidor FastAPI</text>
<text x="900" y="752" text-anchor="middle" class="hs">http://localhost:8000</text>
<line x1="150" y1="795" x2="498" y2="795" stroke="#222" stroke-width="2" marker-end="url(#f)"/>
<text x="162" y="787" class="m" fill="#222">1. fetch(POST /libros, Content-Type: application/json)</text>
<line x1="500" y1="835" x2="898" y2="835" stroke="#5e35b1" stroke-width="2" marker-end="url(#f)"/>
<text x="512" y="827" class="mb" fill="#5e35b1">2. OPTIONS /libros   Origin: http://localhost:5500</text>
<line x1="900" y1="875" x2="502" y2="875" stroke="#b3261e" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#fr)"/>
<text x="512" y="867" class="mb" fill="#b3261e">3. 405 Method Not Allowed (sin headers CORS)</text>
<circle cx="500" cy="910" r="15" fill="#fdecea" stroke="#b3261e" stroke-width="2"/>
<path d="M493,903 L507,917 M507,903 L493,917" stroke="#b3261e" stroke-width="3"/>
<text x="524" y="915" class="mb" fill="#b3261e">4. BLOQUEADO: el POST real nunca se envía (no se guarda nada)</text>
<line x1="500" y1="955" x2="152" y2="955" stroke="#b3261e" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#fr)"/>
<text x="162" y="947" class="m" fill="#b3261e">5. fetch rechaza (TypeError: Failed to fetch)</text>
<rect x="45" y="970" width="880" height="86" rx="6" fill="#fdecea" stroke="#b3261e" stroke-width="1.5"/>
<text x="57" y="992" class="nb" fill="#b3261e">Consola del navegador (DevTools):</text>
<text x="57" y="1012" class="mono" fill="#b3261e">Access to fetch at 'http://localhost:8000/libros' from origin 'http://localhost:5500' has been</text>
<text x="57" y="1028" class="mono" fill="#b3261e">blocked by CORS policy: Response to preflight request doesn't pass access control check:</text>
<text x="57" y="1044" class="mono" fill="#b3261e">No 'Access-Control-Allow-Origin' header is present on the requested resource.</text>
<rect x="985" y="770" width="320" height="176" rx="6" fill="#fafafa" stroke="#888" stroke-width="1.5"/>
<text x="997" y="792" class="nb">Para tener en cuenta</text>
<text x="997" y="810" class="n">• En api.js esto llega como</text>
<text x="997" y="828" class="n">  ApiError con status 0 (error de red)</text>
<text x="997" y="846" class="n">  y ui.js muestra el mensaje.</text>
<text x="997" y="864" class="n">• curl o Postman NO aplican CORS:</text>
<text x="997" y="882" class="n">  ahí la request funciona igual.</text>
<text x="997" y="900" class="n">• CORS lo hace cumplir el navegador;</text>
<text x="997" y="918" class="n">  el servidor solo «da permiso»</text>
<text x="997" y="936" class="n">  con los headers Access-Control-*.</text>
</svg>