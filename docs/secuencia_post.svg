<text x="1394" y="100" text-anchor="middle" class="hs">biblioteca.db</text>
<rect x="1326" y="1360" width="136" height="30" rx="6" fill="#fff3e0" stroke="#8d5a00" stroke-width="1.5"/>
<text x="1394" y="1380" text-anchor="middle" class="h">SQLite</text>
<line x1="90" y1="150" x2="251" y2="150" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="100" y="143" class="m" fill="#222">1. clic en «Guardar» (submit del form)</text>
<path d="M253,177 L281,177 L281,193 L255,193" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="289" y="184" class="m">2. guardarLibro(evento): preventDefault()</text>
<path d="M253,217 L281,217 L281,233 L255,233" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="289" y="224" class="m">3. ui.leerFormulario() → objeto JS {titulo, autor, genero, ...}</text>
<line x1="253" y1="275" x2="414" y2="275" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="263" y="268" class="m" fill="#222">4. crearLibro(datos)</text>
<path d="M416,304 L444,304 L444,320 L418,320" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="452" y="311" class="m">5. JSON.stringify(datos) + header Content-Type: application/json</text>
<line x1="416" y1="360" x2="577" y2="360" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="426" y="353" class="m" fill="#222">6. fetch('http://localhost:8000/libros', {method: 'POST'})</text>
<line x1="579" y1="438" x2="740" y2="438" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="589" y="431" class="m" fill="#222">7. OPTIONS /libros   Origin: http://localhost:5500</text>
<text x="589" y="454" class="m">Access-Control-Request-Method: POST / -Headers: content-type</text>
<line x1="742" y1="495" x2="581" y2="495" stroke="#222" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#fa)"/>
<text x="589" y="488" class="m" fill="#222">8. 200 OK  Access-Control-Allow-Origin: *  (+ Allow-Methods)</text>
<line x1="579" y1="555" x2="740" y2="555" stroke="#1f5fa8" stroke-width="1.6" marker-end="url(#f)"/>
<text x="589" y="548" class="mb" fill="#1f5fa8">9. POST /libros  Content-Type: application/json  body {"titulo": ...}</text>
<line x1="742" y1="590" x2="903" y2="590" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="752" y="583" class="m" fill="#222">10. pasa la request al router</text>
<path d="M905,614 L933,614 L933,630 L907,630" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="941" y="621" class="m">11. Pydantic: JSON → LibroCreate (tipos, largos, rangos, género)</text>
<line x1="905" y1="705" x2="418" y2="705" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#fa)"/>
<text x="426" y="698" class="m" fill="#b3261e">12a. 422 Unprocessable Entity  {"detail": [{"loc": ["body","paginas"], "msg": ..., "type": ...}]}</text>
<line x1="416" y1="738" x2="255" y2="738" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#fa)"/>
<text x="263" y="731" class="m" fill="#b3261e">13a. throw ApiError(422, detail)</text>
<path d="M253,757 L281,757 L281,773 L255,773" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="289" y="764" class="m">14a. ui.mostrarErroresCampos(detail): marca los inputs en rojo (no se toca la BD)</text>
<line x1="905" y1="840" x2="1066" y2="840" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="915" y="833" class="m" fill="#222">12. Depends(get_manager) → get_db()</text>
<line x1="1068" y1="875" x2="1392" y2="875" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="1078" y="868" class="m" fill="#222">13. sqlite3.connect(biblioteca.db)</text>
<line x1="1068" y1="910" x2="1229" y2="910" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="1078" y="903" class="m" fill="#222">14. LibroManager(conn)</text>
<line x1="905" y1="950" x2="1229" y2="950" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="915" y="943" class="m" fill="#222">15. manager.create(datos)</text>
<line x1="1231" y1="985" x2="1392" y2="985" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="1241" y="978" class="m" fill="#222">16. INSERT INTO libros (...) VALUES (?, ?, ...)</text>
<line x1="1231" y1="1020" x2="1392" y2="1020" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="1241" y="1013" class="mb" fill="#222">17. commit()</text>
<line x1="1394" y1="1050" x2="1233" y2="1050" stroke="#222" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#fa)"/>
<text x="1241" y="1043" class="m" fill="#222">18. cursor.lastrowid</text>
<line x1="1231" y1="1085" x2="1392" y2="1085" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="1241" y="1078" class="m" fill="#222">19. get_by_id(id) → SELECT ... WHERE id = ?</text>
<line x1="1231" y1="1118" x2="907" y2="1118" stroke="#222" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#fa)"/>
<text x="915" y="1111" class="m" fill="#222">20. Libro (con id)</text>
<line x1="1068" y1="1150" x2="1392" y2="1150" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="1078" y="1143" class="m" fill="#222">21. fin del request: conn.close() (finally)</text>
<line x1="905" y1="1190" x2="418" y2="1190" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#fa)"/>
<text x="426" y="1183" class="mb" fill="#2e7d32">22. 201 Created  + JSON del libro creado  (+ Access-Control-Allow-Origin)</text>
<line x1="416" y1="1225" x2="255" y2="1225" stroke="#222" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#fa)"/>
<text x="263" y="1218" class="m" fill="#222">23. objeto libro (respuesta parseada)</text>
<path d="M253,1247 L281,1247 L281,1263 L255,1263" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="289" y="1254" class="m">24. ui.mostrarMensaje("creado correctamente"), ui.resetearFormulario()</text>
<line x1="253" y1="1295" x2="414" y2="1295" stroke="#222" stroke-width="1.6" marker-end="url(#f)"/>
<text x="263" y="1288" class="m" fill="#222">25. cargarLibros() → listarLibros()  GET /libros → 200 [lista]</text>
<line x1="253" y1="1325" x2="92" y2="1325" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="7 4" marker-end="url(#fa)"/>
<text x="100" y="1318" class="m" fill="#2e7d32">26. ui.renderizarLibros(): la tabla muestra el libro nuevo</text>
<text x="193" y="1428" class="n">Nota: el preflight (7-8) lo hace el navegador solo; nuestro JS no lo escribe. Si el endpoint lanza HTTPException o hay error, la respuesta igual pasa por CORSMiddleware.</text>
</svg>