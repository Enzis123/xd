<rect x="837" y="60" width="136" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="905" y="82" text-anchor="middle" class="h">FastAPI + Pydantic</text>
<text x="905" y="100" text-anchor="middle" class="hs">endpoint crear_libro</text>
<rect x="837" y="1360" width="136" height="30" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
<text x="905" y="1380" text-anchor="middle" class="h">FastAPI + Pydantic</text>
<line x1="1068" y1="110" x2="1068" y2="1360" stroke="#999" stroke-dasharray="5 4"/>
<rect x="1000" y="60" width="136" height="50" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5"/>
